<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu - Idemitsu</title>
  <link rel="stylesheet" href="./style.css?v=20260818b">
</head>
<body data-page-title-key="page.changePassword">
  <div id="pageLoader" class="page-loader">
    <div class="loader-card">
      <div class="spinner"></div>
      <p id="pageLoaderText" data-i18n="common.checkingSession">Đang kiểm tra phiên đăng nhập...</p>
    </div>
  </div>

  <main id="changePasswordGuestWrap" class="app-shell auth-screen hidden">
    <section class="empty-card">
      <h2 data-i18n="common.accessDenied">Không thể truy cập</h2>
      <p id="changePasswordGuestMessage" data-i18n="common.notLoggedIn">Bạn chưa đăng nhập. Vui lòng đăng nhập trước.</p>
      <a href="./index.html" class="primary-btn inline-btn" data-i18n="common.backToChecklist">Quay về trang checklist</a>
    </section>
  </main>

  <main id="changePasswordScreen" class="app-shell auth-screen hidden">
    <section class="auth-card">
      <div class="auth-lang-switch">
        <div class="sidebar-lang-actions">
          <button type="button" class="lang-switch-btn" data-lang="vi">VI</button>
          <button type="button" class="lang-switch-btn" data-lang="en">EN</button>
        </div>
      </div>
      <div class="brand-line"></div>
      <h1 class="auth-title" data-i18n="changePassword.title">Đổi mật khẩu</h1>
      <p class="auth-subtitle" data-i18n="changePassword.subtitle">Nhập mật khẩu hiện tại và mật khẩu mới để cập nhật tài khoản.</p>
      <p id="changePasswordEmail" class="change-password-email"></p>

      <form id="changePasswordForm" class="form-stack">
        <div class="form-group">
          <label for="currentPasswordInput" data-i18n="changePassword.current">Mật khẩu hiện tại</label>
          <input
            type="password"
            id="currentPasswordInput"
            data-i18n-placeholder="auth.placeholder.password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="form-group">
          <label for="newPasswordInput" data-i18n="changePassword.new">Mật khẩu mới</label>
          <input
            type="password"
            id="newPasswordInput"
            data-i18n-placeholder="auth.placeholder.minPassword"
            placeholder="Tối thiểu 6 ký tự"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmNewPasswordInput" data-i18n="changePassword.confirm">Xác nhận mật khẩu mới</label>
          <input
            type="password"
            id="confirmNewPasswordInput"
            data-i18n-placeholder="auth.placeholder.confirmPassword"
            placeholder="Nhập lại mật khẩu"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" id="changePasswordBtn" class="primary-btn full-btn" data-i18n="changePassword.submit">
          Đổi mật khẩu
        </button>
      </form>

      <div class="note-box">
        <strong data-i18n="auth.note">Lưu ý:</strong>
        <span data-i18n="changePassword.note">Vui lòng đổi mật khẩu trước khi hết hạn chu kỳ 90 ngày.</span>
      </div>

      <a href="./index.html" class="auth-admin-link" data-i18n="changePassword.back">Quay lại</a>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./change-password.js?v=20260818c"></script>
</body>
</html>
